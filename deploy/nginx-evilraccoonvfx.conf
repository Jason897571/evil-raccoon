# evilraccoonvfx.raccoongamingasset.vip → evil-raccoon（过渡域名）
#
# evilraccoon.top 备案下来之前先用 raccoongamingasset.vip 的子域名（它已备案并接入这台服务器，不会被拦截）。
# 放在服务器 /opt/raccoon/nginx/extra-sites/evilraccoonvfx.conf；说明见 nginx-evilraccoon.conf 开头。
# 证书：certbot webroot 签发（2026-11-16），raccoon 的 certbot 容器自动续期。

server {
    listen 80;
    server_name evilraccoonvfx.raccoongamingasset.vip;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://evilraccoonvfx.raccoongamingasset.vip$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name evilraccoonvfx.raccoongamingasset.vip;

    ssl_certificate     /etc/letsencrypt/live/evilraccoonvfx.raccoongamingasset.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evilraccoonvfx.raccoongamingasset.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 2m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $evil_raccoon_web http://evil-raccoon-web:80;

    location / {
        proxy_pass $evil_raccoon_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
