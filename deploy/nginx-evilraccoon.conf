# www.evilraccoon.top → evil-raccoon
#
# 放在服务器 /opt/raccoon/nginx/extra-sites/evilraccoon.conf，由 raccoon 的 nginx 容器加载
# （raccoon 的 nginx-ssl.conf 末尾 include 了 extra-sites/*.conf）。
# 上游是 evil-raccoon 的 er-web 容器，它加入了 raccoon_default 网络、别名 evil-raccoon-web。
# 用「变量 + Docker 内置 DNS」延迟解析：evil-raccoon 没起来时，raccoon 的 nginx 照样能启动和 reload，
# 不会因为找不到上游把 raccoon 正式站拖下水。
#
# 证书：certbot webroot 签发，raccoon 的 certbot 容器会自动续期。

server {
    listen 80;
    server_name evilraccoon.top www.evilraccoon.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.evilraccoon.top$request_uri;
    }
}

# 裸域名统一跳到 www（支付宝回调、对外链接都用 www）
server {
    listen 443 ssl http2;
    server_name evilraccoon.top;

    ssl_certificate     /etc/letsencrypt/live/evilraccoon.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evilraccoon.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.evilraccoon.top$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.evilraccoon.top;

    ssl_certificate     /etc/letsencrypt/live/evilraccoon.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evilraccoon.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 2m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $evil_raccoon_web http://evil-raccoon-web:80;

    location / {
        proxy_pass $evil_raccoon_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
